<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار السودان وأفريقيا</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  background: #111;
  color: #fff;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

nav {
  background: #222;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

nav button {
  background: none;
  border: none;
  color: white;
  padding: 12px 15px;
  cursor: pointer;
  font-size: 14px;
}

nav button:hover {
  background: #444;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  background: #ddd;
}

.card h3 {
  font-size: 15px;
  margin: 10px;
}

.card p {
  font-size: 13px;
  color: #555;
  margin: 0 10px 15px;
}

.status {
  text-align: center;
  margin: 15px;
}

.error { color: red; }
.loading { color: #333; }
</style>
</head>

<body>

<header>
📰 أخبار السودان وأفريقيا
</header>

<nav>
  <button onclick="loadNews('sudan')">السودان</button>
  <button onclick="loadNews('africa')">أفريقيا</button>
  <button onclick="loadNews('world')">عالمية</button>
  <button onclick="loadNews('technology')">تكنولوجيا</button>
</nav>

<div class="container">

  <div id="status" class="status loading">جاري تحميل الأخبار...</div>
  <div id="news" class="grid"></div>

</div>

<script>
const API_KEY = "PUT_YOUR_API_KEY_HERE";

async function loadNews(query) {
  const newsDiv = document.getElementById("news");
  const status = document.getElementById("status");

  newsDiv.innerHTML = "";
  status.innerText = "جاري تحميل الأخبار...";

  try {
    const res = await fetch(
      `https://newsapi.org/v2/everything?q=${query}&language=en&pageSize=12&apiKey=${API_KEY}`
    );

    const data = await res.json();

    if (!data.articles || data.articles.length === 0) {
      status.innerText = "لا توجد أخبار حالياً";
      return;
    }

    status.innerText = "";

    data.articles.forEach(article => {

      const img = article.urlToImage 
        ? article.urlToImage 
        : "https://via.placeholder.com/400x200?text=No+Image";

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="${img}" onerror="this.src='https://via.placeholder.com/400x200?text=Image+Error'">
        <h3>${article.title || "بدون عنوان"}</h3>
        <p>${article.description || "لا يوجد وصف"}</p>
      `;

      newsDiv.appendChild(card);
    });

  } catch (err) {
    status.innerText = "فشل تحميل الأخبار ❌";
    console.error(err);
  }
}

// تشغيل افتراضي
loadNews("sudan");
</script>

</body>
</html>
