<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أخبار السودان</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #b80000;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    nav button {
      padding: 10px 20px;
      border: none;
      background: none;
      font-weight: bold;
      cursor: pointer;
    }

    nav button.active {
      color: #b80000;
      border-bottom: 2px solid #b80000;
    }

    .container {
      padding: 15px;
    }

    .news-card {
      background: white;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .news-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .news-content {
      padding: 10px;
    }

    .news-title {
      font-size: 16px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .news-link {
      color: #b80000;
      font-size: 14px;
      text-decoration: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: gray;
    }
  </style>
</head>

<body>

<header>📰 أخبار السودان والعالم</header>

<nav>
  <button onclick="loadNews('sudan')" class="active" id="btn-sudan">السودان</button>
  <button onclick="loadNews('world')" id="btn-world">العالم</button>
</nav>

<div class="container" id="news-container">
  <div class="loading">جاري تحميل الأخبار...</div>
</div>

<script>
const API = "https://api.rss2json.com/v1/api.json?rss_url=";

function setActive(type) {
  document.getElementById("btn-sudan").classList.remove("active");
  document.getElementById("btn-world").classList.remove("active");
  document.getElementById("btn-" + type).classList.add("active");
}

async function loadNews(type) {
  setActive(type);

  const container = document.getElementById("news-container");
  container.innerHTML = '<div class="loading">جاري تحميل الأخبار...</div>';

  let rss = "";

  if (type === "sudan") {
    rss = "https://news.google.com/rss/search?q=السودان&hl=ar&gl=EG&ceid=EG:ar";
  } else {
    rss = "https://news.google.com/rss?hl=ar&gl=EG&ceid=EG:ar";
  }

  try {
    const res = await fetch(API + encodeURIComponent(rss));
    const data = await res.json();

    container.innerHTML = data.items.slice(0, 10).map(item => `
      <div class="news-card">
        <img src="${getImage(item)}">
        <div class="news-content">
          <div class="news-title">${item.title}</div>
          <a class="news-link" href="${item.link}" target="_blank">اقرأ المزيد ←</a>
        </div>
      </div>
    `).join("");

  } catch (e) {
    container.innerHTML = "<div class='loading'>فشل تحميل الأخبار</div>";
  }
}

loadNews("sudan");
</script>

</body>
</html>
