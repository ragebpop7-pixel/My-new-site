<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أخبار السودان</title>
</head>

<body style="font-family: sans-serif; padding: 15px;">

  <h2 style="text-align:center; color:#0056b3;">أخبار السودان العاجلة</h2>

  <div id="news-container" style="text-align:center; color:#666;">
    جاري تحميل الأخبار...
  </div>

  <script>
    const apiKey = '733ec455e336be1b8b95d2c3a17b7938';
    const url = `https://gnews.io/api/v4/search?q=السودان&lang=ar&max=10&apikey=${apiKey}`;

    async function fetchNews() {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Network error');

        const data = await response.json();
        const container = document.getElementById('news-container');

        if (data.articles && data.articles.length > 0) {
          container.innerHTML = data.articles.map(article => `
            <div style="padding: 15px; border-bottom: 1px solid #eee;">
              <h3 style="font-size: 16px;">${article.title}</h3>
              <p style="font-size: 13px; color:#555;">
                ${article.description ? article.description.substring(0, 80) : ''}
              </p>
              <a href="${article.url}" target="_blank" style="color:#e91e63;">
                إقرأ المزيد
              </a>
            </div>
          `).join('');
        } else {
          container.innerHTML = "لا توجد أخبار حالياً.";
        }

      } catch (error) {
        console.error(error);
        document.getElementById('news-container').innerHTML = "فشل الاتصال بالمصدر.";
      }
    }

    fetchNews();
  </script>

</body>
</html>
