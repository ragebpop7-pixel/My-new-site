<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أخبار السودان</title>
</head>

<body style="font-family: sans-serif; padding: 15px;">

  <h2 style="text-align:center; color:#0056b3;">أخبار السودان العاجلة</h2>

  <div id="news-container" style="text-align:center; color:#666;">
    جاري تحميل الأخبار...
  </div>

  <script>
    const rssUrl = "https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/search?q=السودان&hl=ar&gl=EG&ceid=EG:ar";

    async function fetchNews() {
      try {
        const res = await fetch(rssUrl);
        const data = await res.json();

        const container = document.getElementById("news-container");

        if (data.items && data.items.length > 0) {
          container.innerHTML = data.items.slice(0, 10).map(item => `
            <div style="padding: 15px; border-bottom: 1px solid #eee;">
              <h3 style="font-size: 16px;">${item.title}</h3>
              <a href="${item.link}" target="_blank" style="color:#e91e63;">
                إقرأ الخبر
              </a>
            </div>
          `).join("");
        } else {
          container.innerHTML = "لا توجد أخبار حالياً.";
        }

      } catch (error) {
        console.error(error);
        document.getElementById("news-container").innerHTML = "فشل تحميل الأخبار.";
      }
    }

    fetchNews();
  </script>

</body>
</html>
