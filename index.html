<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أخبار السودان</title>
    <style>
      body {
        direction: rtl;
        font-family: Tahoma, Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
      }
      #news-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }
      .news-card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .news-card img {
        max-width: 100%;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div> <h2 style="text-align: center;">آخر أخبار السودان</h2>
    <div id="news-container">جاري تحميل الأخبار...</div>

    <script type="module" src="/src/main.tsx"></script>
    <script src="/fetchNews.js"></script>
  </body>
</html>
